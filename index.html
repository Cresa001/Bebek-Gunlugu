<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Web Erişilebilirlik Tarayıcısı</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
    background:
      radial-gradient(circle at 10% 10%,rgba(0,255,180,.12),transparent 30%),
      radial-gradient(circle at 90% 20%,rgba(80,100,255,.15),transparent 30%),
      #070b13;
    color:#eef3ff;
}

.container{
    width:min(1400px,94%);
    margin:35px auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:25px;
    border:1px solid #202b3e;
    background:rgba(13,19,31,.82);
    backdrop-filter:blur(18px);
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.logoIcon{
    width:52px;
    height:52px;
    display:grid;
    place-items:center;
    border-radius:15px;
    background:linear-gradient(135deg,#00e5a0,#3d6cff);
    font-size:25px;
}

.logo h1{
    font-size:21px;
}

.logo p{
    color:#8995aa;
    margin-top:4px;
    font-size:13px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#7d8ba2;
    font-size:13px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00d991;
    box-shadow:0 0 12px #00d991;
}

.controls{
    margin-top:22px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:14px;
}

.card{
    border:1px solid #202b3e;
    background:rgba(13,19,31,.82);
    border-radius:18px;
    padding:18px;
}

.card label{
    display:block;
    color:#8793a9;
    font-size:12px;
    margin-bottom:9px;
}

select,input{
    width:100%;
    border:1px solid #29364c;
    outline:none;
    color:white;
    background:#0b111c;
    padding:12px 13px;
    border-radius:11px;
}

select:focus,input:focus{
    border-color:#3d6cff;
}

button{
    border:0;
    cursor:pointer;
    border-radius:12px;
    padding:12px 18px;
    font-weight:700;
    color:white;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.start{
    background:linear-gradient(135deg,#00c98a,#087cff);
    min-width:190px;
    align-self:end;
}

.stop{
    background:#202b3e;
    display:none;
}

.stats{
    margin-top:22px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
}

.stat{
    padding:19px;
    border:1px solid #202b3e;
    background:rgba(13,19,31,.82);
    border-radius:17px;
}

.stat small{
    color:#7e8aa0;
}

.stat strong{
    display:block;
    font-size:27px;
    margin-top:8px;
}

.tableCard{
    margin-top:22px;
    padding:0;
    overflow:hidden;
}

.tableTop{
    padding:19px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #202b3e;
}

.tableTop h2{
    font-size:17px;
}

.actions{
    display:flex;
    gap:8px;
}

.secondary{
    background:#172235;
    border:1px solid #29364c;
}

.tableWrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:14px 16px;
    text-align:left;
    border-bottom:1px solid #1d2839;
    font-size:13px;
}

th{
    color:#77869e;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.7px;
    background:#0b111c;
}

td{
    color:#dbe3f1;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:6px 9px;
    border-radius:8px;
    font-size:11px;
    font-weight:700;
}

.ok{
    background:rgba(0,211,145,.12);
    color:#35e6ad;
}

.redirect{
    background:rgba(255,190,70,.12);
    color:#ffc45c;
}

.error{
    background:rgba(255,75,100,.12);
    color:#ff7185;
}

.pending{
    background:rgba(100,130,180,.12);
    color:#9eacc2;
}

.progressBox{
    margin-top:22px;
    display:none;
}

.progressInfo{
    display:flex;
    justify-content:space-between;
    color:#8995aa;
    font-size:12px;
    margin-bottom:9px;
}

.progress{
    height:9px;
    background:#111a28;
    border-radius:20px;
    overflow:hidden;
}

.progressBar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00d991,#377cff);
    transition:.25s;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#66758d;
}

.emptyIcon{
    font-size:40px;
    margin-bottom:12px;
}

@media(max-width:900px){
    .controls{grid-template-columns:1fr 1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .start{width:100%}
}

@media(max-width:600px){
    .header{align-items:flex-start;flex-direction:column}
    .controls{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .tableTop{align-items:flex-start;flex-direction:column}
    .actions{width:100%}
    .actions button{flex:1}
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">
            <div class="logoIcon">⌁</div>
            <div>
                <h1>Web Erişilebilirlik Tarayıcısı</h1>
                <p>Alan adı ve bağlantı durumlarını analiz et</p>
            </div>
        </div>

        <div class="status">
            <span class="dot"></span>
            Sistem hazır
        </div>
    </header>

    <section class="controls">

        <div class="card">
            <label>TARAMA DERİNLİĞİ</label>
            <select id="depth">
                <option value="1">1 — Sadece ana adres</option>
                <option value="2" selected>2 — Alt bağlantılar</option>
                <option value="3">3 — Geniş tarama</option>
            </select>
        </div>

        <div class="card">
            <label>MAKSİMUM URL</label>
            <select id="limit">
                <option value="25">25 URL</option>
                <option value="50" selected>50 URL</option>
                <option value="100">100 URL</option>
                <option value="250">250 URL</option>
            </select>
        </div>

        <div class="card">
            <label>FİLTRE</label>
            <select id="filter">
                <option value="all">Tüm sonuçlar</option>
                <option value="ok">Başarılı</option>
                <option value="redirect">Yönlendirme</option>
                <option value="error">Hatalı</option>
            </select>
        </div>

        <button class="start" id="startBtn" onclick="startScan()">
            ▶ Taramayı Başlat
        </button>

    </section>

    <section class="progressBox" id="progressBox">
        <div class="progressInfo">
            <span id="progressText">Hazırlanıyor...</span>
            <span id="progressPercent">0%</span>
        </div>

        <div class="progress">
            <div class="progressBar" id="progressBar"></div>
        </div>
    </section>

    <section class="stats">

        <div class="stat">
            <small>Toplam</small>
            <strong id="total">0</strong>
        </div>

        <div class="stat">
            <small>Başarılı</small>
            <strong id="success">0</strong>
        </div>

        <div class="stat">
            <small>Yönlendirme</small>
            <strong id="redirects">0</strong>
        </div>

        <div class="stat">
            <small>Hatalı</small>
            <strong id="errors">0</strong>
        </div>

        <div class="stat">
            <small>Ortalama süre</small>
            <strong id="avg">0 ms</strong>
        </div>

    </section>

    <section class="card tableCard">

        <div class="tableTop">
            <h2>Tarama Sonuçları</h2>

            <div class="actions">
                <button class="secondary" onclick="downloadCSV()">
                    CSV
                </button>

                <button class="secondary" onclick="downloadExcel()">
                    Excel
                </button>

                <button class="secondary" onclick="clearResults()">
                    Temizle
                </button>
            </div>
        </div>

        <div class="tableWrap">

            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>URL</th>
                        <th>Durum</th>
                        <th>HTTP</th>
                        <th>Yanıt</th>
                        <th>Zaman</th>
                    </tr>
                </thead>

                <tbody id="results">
                    <tr>
                        <td colspan="6">
                            <div class="empty">
                                <div class="emptyIcon">⌕</div>
                                Taramayı başlatmak için yukarıdaki butona basın.
                            </div>
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</div>

<script>

let results = [];
let scanning = false;

/*
    Demo veri kaynağı.
    Gerçek otomatik internet taraması için bu bölümün
    backend API ile değiştirilmesi gerekir.
*/
const seedSites = [
    "https://example.com",
    "https://example.org",
    "https://example.net",
    "https://www.wikipedia.org",
    "https://www.mozilla.org",
    "https://www.python.org",
    "https://www.openstreetmap.org",
    "https://www.gnu.org"
];

async function startScan(){

    if(scanning) return;

    scanning = true;
    results = [];

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("progressBox").style.display = "block";

    const limit =
        Number(document.getElementById("limit").value);

    const targets = seedSites.slice(0, limit);

    for(let i=0;i<targets.length;i++){

        const url = targets[i];

        document.getElementById("progressText").textContent =
            "Kontrol ediliyor: " + url;

        const percent =
            Math.round(((i+1)/targets.length)*100);

        document.getElementById("progressBar").style.width =
            percent + "%";

        document.getElementById("progressPercent").textContent =
            percent + "%";

        await checkUrl(url);

        updateStats();
        renderTable();

        await sleep(180);
    }

    document.getElementById("progressText").textContent =
        "Tarama tamamlandı";

    scanning = false;
    document.getElementById("startBtn").style.display = "block";
}

async function checkUrl(url){

    const started = performance.now();

    /*
       Tarayıcı CORS politikaları nedeniyle doğrudan
       üçüncü taraf sitelerin HTTP durum kodlarını
       güvenilir biçimde okuyamayabilir.
    */

    let status = "Kontrol edilemedi";
    let http = "-";

    try{

        const controller = new AbortController();

        const timeout = setTimeout(
            () => controller.abort(),
            6000
        );

        const response = await fetch(url,{
            method:"HEAD",
            mode:"cors",
            signal:controller.signal
        });

        clearTimeout(timeout);

        http = response.status;

        if(response.status >= 200 &&
           response.status < 300){

            status = "Başarılı";
        }
        else if(response.status >= 300 &&
                response.status < 400){

            status = "Yönlendirme";
        }
        else{

            status = "Hatalı";
        }

    }catch(e){

        status = "Erişim kontrolü başarısız";
        http = "-";
    }

    const elapsed =
        Math.round(performance.now()-started);

    results.push({
        url,
        status,
        http,
        time:elapsed
    });
}

function renderTable(){

    const tbody =
        document.getElementById("results");

    const filter =
        document.getElementById("filter").value;

    let data = results;

    if(filter !== "all"){

        if(filter === "ok"){
            data = results.filter(x=>x.status==="Başarılı");
        }

        if(filter === "redirect"){
            data = results.filter(x=>x.status==="Yönlendirme");
        }

        if(filter === "error"){
            data = results.filter(x=>
                x.status==="Hatalı" ||
                x.status==="Erişim kontrolü başarısız"
            );
        }
    }

    if(!data.length){

        tbody.innerHTML = `
        <tr>
            <td colspan="6">
                <div class="empty">
                    Sonuç bulunamadı.
                </div>
            </td>
        </tr>`;

        return;
    }

    tbody.innerHTML = data.map((item,index)=>{

        let cls = "pending";

        if(item.status==="Başarılı")
            cls="ok";

        else if(item.status==="Yönlendirme")
            cls="redirect";

        else if(
            item.status==="Hatalı" ||
            item.status==="Erişim kontrolü başarısız"
        )
            cls="error";

        return `
        <tr>
            <td>${index+1}</td>

            <td>
                <strong>${escapeHtml(item.url)}</strong>
            </td>

            <td>
                <span class="badge ${cls}">
                    ${escapeHtml(item.status)}
                </span>
            </td>

            <td>${item.http}</td>

            <td>${item.time} ms</td>

            <td>${new Date().toLocaleTimeString("tr-TR")}</td>
        </tr>`;

    }).join("");
}

function updateStats(){

    const total = results.length;

    const success =
        results.filter(x=>x.status==="Başarılı").length;

    const redirects =
        results.filter(x=>x.status==="Yönlendirme").length;

    const errors =
        results.filter(x=>
            x.status==="Hatalı" ||
            x.status==="Erişim kontrolü başarısız"
        ).length;

    const avg =
        total
        ? Math.round(
            results.reduce((a,b)=>a+b.time,0)/total
          )
        : 0;

    document.getElementById("total").textContent = total;
    document.getElementById("success").textContent = success;
    document.getElementById("redirects").textContent = redirects;
    document.getElementById("errors").textContent = errors;
    document.getElementById("avg").textContent = avg + " ms";
}

function downloadCSV(){

    if(!results.length){
        alert("Önce tarama yapın.");
        return;
    }

    const rows = [
        ["URL","Durum","HTTP","Yanıt Süresi (ms)"],
        ...results.map(x=>[
            x.url,
            x.status,
            x.http,
            x.time
        ])
    ];

    const csv =
        "\uFEFF" +
        rows.map(row =>
            row.map(value =>
                `"${String(value).replaceAll('"','""')}"`
            ).join(";")
        ).join("\n");

    const blob =
        new Blob([csv],{
            type:"text/csv;charset=utf-8;"
        });

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download =
        "web_tarama_" +
        new Date().toISOString().slice(0,10) +
        ".csv";

    a.click();
}

function downloadExcel(){

    if(!results.length){
        alert("Önce tarama yapın.");
        return;
    }

    /*
       Excel'in doğrudan açabildiği HTML tablo formatı.
       .xls olarak kaydedilir.
    */

    let html = `
    <html>
    <head>
    <meta charset="UTF-8">
    </head>
    <body>
    <table border="1">
    <tr>
        <th>URL</th>
        <th>Durum</th>
        <th>HTTP</th>
        <th>Yanıt Süresi (ms)</th>
    </tr>`;

    results.forEach(x=>{

        html += `
        <tr>
            <td>${escapeHtml(x.url)}</td>
            <td>${escapeHtml(x.status)}</td>
            <td>${x.http}</td>
            <td>${x.time}</td>
        </tr>`;
    });

    html += `
    </table>
    </body>
    </html>`;

    const blob =
        new Blob(
            ["\uFEFF",html],
            {type:"application/vnd.ms-excel"}
        );

    const a=document.createElement("a");

    a.href=URL.createObjectURL(blob);
    a.download =
        "web_tarama_" +
        new Date().toISOString().slice(0,10) +
        ".xls";

    a.click();
}

function clearResults(){

    results=[];

    document.getElementById("results").innerHTML=`
    <tr>
        <td colspan="6">
            <div class="empty">
                <div class="emptyIcon">⌕</div>
                Taramayı başlatmak için yukarıdaki butona basın.
            </div>
        </td>
    </tr>`;

    updateStats();

    document.getElementById("progressBar").style.width="0%";
    document.getElementById("progressPercent").textContent="0%";
    document.getElementById("progressText").textContent="Hazırlanıyor...";
}

document.getElementById("filter")
.addEventListener("change",renderTable);

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

</script>

</body>
</html>
